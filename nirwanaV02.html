<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirwana Guidance System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#fbbf24;
    font-size:40px;
}

.header p{
    color:#cbd5e1;
}

.card{
    background:white;
    color:black;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.card h2{
    margin-bottom:15px;
    color:#1e293b;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.btn{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#1d4ed8;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.score-box{
    color:white;
    padding:20px;
    text-align:center;
    border-radius:15px;
}

.financial{
    background:#16a34a;
}

.mental{
    background:#ea580c;
}

.spiritual{
    background:#7c3aed;
}

.overall{
    background:#0284c7;
}

#resultArea{
    padding:15px;
    border-radius:10px;
    background:#f8fafc;
}

.guidance{
    margin-top:15px;
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>☸ Nirwana Guidance System</h1>
    <p>Life Assessment & Buddhist Guidance Platform</p>
</div>

<div class="card">
    <h2>Personal Information</h2>

    <div class="form-grid">

        <div>
            <label>Name</label>
            <input type="text" id="name">
        </div>

        <div>
            <label>Age</label>
            <input type="number" id="age">
        </div>

        <div>
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <div>
            <label>Education</label>
            <select id="education">
                <option>School</option>
                <option>Diploma</option>
                <option>Degree</option>
                <option>Masters</option>
                <option>PhD</option>
            </select>
        </div>

        <div>
            <label>Occupation</label>
            <input type="text">
        </div>

        <div>
            <label>Parent Status</label>
            <select>
                <option>Both Alive</option>
                <option>Mother Alive</option>
                <option>Father Alive</option>
                <option>Both Deceased</option>
            </select>
        </div>

    </div>
</div>

<div class="card">
    <h2>Life Assessment</h2>

    <div class="form-grid">

        <div>
            <label>Monthly Income (LKR)</label>
            <input type="number" id="income">
        </div>

        <div>
            <label>Savings (LKR)</label>
            <input type="number" id="savings">
        </div>

        <div>
            <label>Stress Level (1-10)</label>
            <input type="number" id="stress" min="1" max="10">
        </div>

        <div>
            <label>Happiness Level (1-10)</label>
            <input type="number" id="happiness" min="1" max="10">
        </div>

        <div>
            <label>Meditation Frequency</label>
            <select id="meditation">
                <option value="100">Daily</option>
                <option value="70">Weekly</option>
                <option value="40">Monthly</option>
                <option value="10">Never</option>
            </select>
        </div>

        <div>
            <label>Temple Visits</label>
            <select id="temple">
                <option value="100">Weekly</option>
                <option value="70">Monthly</option>
                <option value="40">Rarely</option>
            </select>
        </div>

    </div>

    <button class="btn" onclick="analyzeLife()">
        Analyze Life
    </button>

</div>

<div class="card">
    <h2>Life Scores Dashboard</h2>

    <div class="dashboard">

        <div class="score-box financial">
            <h3>Financial</h3>
            <h1 id="financialScore">0%</h1>
        </div>

        <div class="score-box mental">
            <h3>Mental</h3>
            <h1 id="mentalScore">0%</h1>
        </div>

        <div class="score-box spiritual">
            <h3>Spiritual</h3>
            <h1 id="spiritualScore">0%</h1>
        </div>

        <div class="score-box overall">
            <h3>Overall</h3>
            <h1 id="overallScore">0%</h1>
        </div>

    </div>
</div>

<div class="card">

    <h2>Assessment Result</h2>

    <div id="resultArea">

        <h3>Please complete the form and click Analyze Life.</h3>

    </div>

</div>

<div class="footer">
    Nirwana Guidance System v1.0
</div>

</div>

<script>

function analyzeLife()
{
    var name =
        document.getElementById("name").value || "User";

    var income =
        parseInt(document.getElementById("income").value) || 0;

    var savings =
        parseInt(document.getElementById("savings").value) || 0;

    var stress =
        parseInt(document.getElementById("stress").value) || 5;

    var happiness =
        parseInt(document.getElementById("happiness").value) || 5;

    var meditation =
        parseInt(document.getElementById("meditation").value);

    var temple =
        parseInt(document.getElementById("temple").value);

    let financialScore = 0;

    if(income >= 300000)
        financialScore = 100;
    else if(income >= 150000)
        financialScore = 80;
    else if(income >= 75000)
        financialScore = 60;
    else
        financialScore = 40;

    financialScore += Math.min(savings / 10000, 20);

    if(financialScore > 100)
        financialScore = 100;

    let mentalScore =
        (((10 - stress) * 10) +
        (happiness * 10)) / 2;

    let spiritualScore =
        (meditation + temple) / 2;

    let overall =
        (financialScore * 0.30) +
        (mentalScore * 0.35) +
        (spiritualScore * 0.35);

    let lifeType = "";
    let guidance = "";

    if(financialScore >= 80 &&
       mentalScore >= 70 &&
       spiritualScore >= 70)
    {
        lifeType = "☸ Nirwana-Oriented Lifestyle";

        guidance = `
        <ul>
            <li>Continue daily meditation.</li>
            <li>Deepen mindfulness practice.</li>
            <li>Support others through generosity.</li>
            <li>Study Dhamma regularly.</li>
        </ul>`;
    }
    else if(financialScore >= 80 &&
            mentalScore < 60)
    {
        lifeType = "💰 Prosperous but Stressful Life";

        guidance = `
        <ul>
            <li>Reduce work pressure.</li>
            <li>Meditate 15 minutes daily.</li>
            <li>Spend more time with family.</li>
            <li>Practice gratitude.</li>
        </ul>`;
    }
    else if(financialScore < 60 &&
            mentalScore >= 70)
    {
        lifeType = "😊 Financially Struggling but Happy";

        guidance = `
        <ul>
            <li>Maintain contentment.</li>
            <li>Improve professional skills.</li>
            <li>Practice generosity.</li>
            <li>Continue mindfulness.</li>
        </ul>`;
    }
    else if(financialScore >= 70 &&
            spiritualScore < 40)
    {
        lifeType = "🏆 Wealthy but Spiritually Empty";

        guidance = `
        <ul>
            <li>Increase meditation.</li>
            <li>Visit temples more often.</li>
            <li>Reflect on impermanence.</li>
            <li>Reduce attachment to possessions.</li>
        </ul>`;
    }
    else
    {
        lifeType = "🌱 Developing Life";

        guidance = `
        <ul>
            <li>Improve mental wellbeing.</li>
            <li>Increase healthy activities.</li>
            <li>Develop mindfulness.</li>
            <li>Practice ethical living.</li>
        </ul>`;
    }

    document.getElementById("financialScore").innerHTML =
        Math.round(financialScore) + "%";

    document.getElementById("mentalScore").innerHTML =
        Math.round(mentalScore) + "%";

    document.getElementById("spiritualScore").innerHTML =
        Math.round(spiritualScore) + "%";

    document.getElementById("overallScore").innerHTML =
        Math.round(overall) + "%";

    document.getElementById("resultArea").innerHTML = `
        <h2>${lifeType}</h2>
        <br>

        <strong>Name:</strong> ${name}<br><br>

        <strong>Financial Score:</strong>
        ${Math.round(financialScore)}%<br>

        <strong>Mental Score:</strong>
        ${Math.round(mentalScore)}%<br>

        <strong>Spiritual Score:</strong>
        ${Math.round(spiritualScore)}%<br>

        <strong>Overall Life Score:</strong>
        ${Math.round(overall)}%

        <div class="guidance">
            <h3>Personalized Nirwana Guidance</h3>
            ${guidance}
        </div>
    `;
}

</script>

</body>
</html>
``
